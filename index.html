<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15161A">
<title>LED 체인 설계기</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">

  <!-- 노드-그래프 캔버스 뷰 -->
  <div id="graphView" class="view">
    <canvas id="graphCanvas"></canvas>
    <div id="nodeLayer"></div>

    <!-- 노드 추가 팔레트: js/core/nodeTypes.js의 NODE_TYPES와 아이콘/라벨을 맞춰 유지할 것 -->
    <div id="palette" class="palette">
      <button class="palette-btn" data-type="input">💻 입력</button>
      <button class="palette-btn" data-type="console">🖥️ 콘솔/프로세서</button>
      <button class="palette-btn" data-type="sending">📡 샌딩카드</button>
      <button class="palette-btn" data-type="led">🟩 LED디스플레이</button>
      <button class="palette-btn" data-type="power">🔌 메인전원</button>
      <button class="palette-btn" data-type="distro">⚡ 분전함</button>
    </div>

    <!-- 선택 노드 속성 패널 -->
    <div id="propsPanel" class="props-panel" hidden>
      <div class="props-head">
        <span id="propsTitle"></span>
        <button id="propsClose" class="props-close">✕</button>
      </div>
      <div id="propsBody" class="props-body"></div>
    </div>

    <!-- 검증 이슈 패널 -->
    <div id="issuesPanel" class="issues-panel">
      <div class="issues-head" id="issuesToggle">
        <span class="issues-chevron">▾</span>
        <span>이슈</span>
        <span id="issuesCount" class="issues-count">0</span>
      </div>
      <div id="issuesList" class="issues-list"></div>
    </div>

    <!-- 저장/불러오기 -->
    <button id="saveLoadBtn" class="save-load-btn">💾 저장/불러오기</button>
    <div id="saveLoadModal" class="modal-bg" hidden>
      <div class="modal-card">
        <div class="modal-head">
          <span>저장/불러오기</span>
          <button id="saveLoadClose" class="props-close">✕</button>
        </div>
        <div class="modal-body">
          <div class="save-new-row">
            <input id="saveNameInput" type="text" placeholder="현장 이름">
            <button id="saveNewBtn">저장</button>
          </div>
          <div id="saveList" class="save-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- LED 설계 세부 페이지 -->
  <div id="ledDesignView" class="view" hidden>
    <div class="led-header">
      <button id="ledBackBtn" class="led-back-btn">← 그래프로 돌아가기</button>
      <label class="led-area-field">가로(mm)<input id="ledAreaW" type="number" min="0" step="500"></label>
      <label class="led-area-field">세로(mm)<input id="ledAreaH" type="number" min="0" step="500"></label>
      <span id="ledAreaInch" class="led-area-inch"></span>
    </div>
    <div class="led-body">
      <div class="led-grid-wrap">
        <div class="led-new-zone-toolbar">
          <label>신규 구역 LED 피치
            <select id="ledNewPitch">
              <option value="2mm">2mm</option>
              <option value="3mm" selected>3mm</option>
              <option value="4mm">4mm</option>
            </select>
          </label>
          <label>패널 크기
            <select id="ledNewPanelSize">
              <option value="500x500">500×500mm</option>
              <option value="500x1000">500×1000mm</option>
            </select>
          </label>
          <span class="led-grid-hint">그리드를 드래그해 새 구역을 만드세요 (500mm 칸 단위)</span>
        </div>
        <div class="led-grid-scroll">
          <canvas id="ledGridCanvas"></canvas>
        </div>
      </div>
      <div class="led-side">
        <div class="led-side-section">
          <div class="led-side-title">구역 <span id="ledZoneCount">0</span></div>
          <div id="ledZoneList" class="led-zone-list"></div>
        </div>
        <div class="led-side-section">
          <div class="led-port-tabs">
            <button class="led-port-tab on" data-tab="lan">LAN</button>
            <button class="led-port-tab" data-tab="pwr">PWR</button>
          </div>
          <div class="led-port-source" id="ledPortSource"></div>
          <button id="ledAutoAssignBtn" class="led-auto-btn">자동 할당</button>
          <div id="ledPortList" class="led-port-list"></div>
        </div>
        <div class="led-side-section led-total">
          총 필요 픽셀: <b id="ledTotalPx">0</b>px
        </div>
      </div>
    </div>
  </div>

</div>

<!-- 업데이트 배너 (포그라운드 중 새 버전 준비 시 표시) -->
<div id="updateBanner" class="update-banner">
  <div class="update-banner-card">
    <div class="upd-title">업데이트 준비 완료</div>
    <div class="upd-body">새 버전이 준비됐습니다.<br>지금 업데이트하시겠습니까?</div>
  </div>
</div>
<!-- 앱 공통 토스트 -->
<div id="appToast" class="app-toast"></div>

<script src="./js/core/idgen.js"></script>
<script src="./js/core/nodeTypes.js"></script>
<script src="./js/core/graphOps.js"></script>
<script src="./js/devices/devices.js"></script>
<script src="./js/core/state.js"></script>
<script src="./js/core/canvasRenderer.js"></script>
<script src="./js/core/nodeCardRenderer.js"></script>
<script src="./js/core/propertiesPanel.js"></script>
<script src="./js/validation/capacityRules.js"></script>
<script src="./js/validation/validationEngine.js"></script>
<script src="./js/leddesign/specs.js"></script>
<script src="./js/leddesign/betaPanels.js"></script>
<script src="./js/leddesign/betaAreaInchLabel.js"></script>
<script src="./js/leddesign/portAssignment.js"></script>
<script src="./js/leddesign/ledDesignView.js"></script>
<script src="./js/save/projectState.js"></script>
<script src="./js/save/saveStore.js"></script>
<script src="./js/core/interactions.js"></script>
<script src="./js/app.js"></script>

<!-- Service Worker 등록 -->
<script>
  if ('serviceWorker' in navigator) {
    const _wasControlled = !!navigator.serviceWorker.controller;
    let _updateReady = false;

    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!_wasControlled) { return; } // 최초 설치 — 업데이트 아님
      if (document.hidden) {
        _updateReady = true;
      } else {
        document.getElementById('updateBanner').style.display = 'flex';
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && _updateReady) {
        _updateReady = false;
        sessionStorage.setItem('sw-just-updated', '1');
        location.reload();
      }
    });

    window._swReload = async function () {
      try { sessionStorage.setItem('sw-just-updated', '1'); } catch (_) {}
      if (navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage('RECACHE_CORE');
        await new Promise(r => setTimeout(r, 1500));
      }
      location.reload();
    };

    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' })
        .catch(err => console.warn('SW 등록 실패:', err));
    });
  }
</script>
</body>
</html>
