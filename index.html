<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15161A">
<title>LED 체인 설계기</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="체인 설계기">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">

  <!-- 노드-그래프 캔버스 뷰 -->
  <div id="graphView" class="view">
    <canvas id="graphCanvas"></canvas>
    <div id="nodeLayer"></div>

    <!-- 노드 추가: "+ 장비 추가" 버튼을 누르면 드롭다운이 애니메이션과 함께 펼쳐진다.
         js/core/nodeTypes.js의 NODE_TYPES와 아이콘/라벨을 맞춰 유지할 것 -->
    <div id="paletteWrap" class="palette-wrap">
      <button id="paletteToggleBtn" class="palette-toggle-btn">
        <span class="palette-toggle-plus">+</span> 장비 추가
      </button>
      <div id="palette" class="palette">
        <button class="palette-btn" data-type="input">💻 인풋소스</button>
        <button class="palette-btn" data-type="console">🖥️ 콘솔</button>
        <button class="palette-btn" data-type="sending">📡 샌딩카드</button>
        <button class="palette-btn" data-type="led">🟩 LED디스플레이</button>
        <button class="palette-btn" data-type="power">🔌 메인전원</button>
        <button class="palette-btn" data-type="distro">⚡ 분전함</button>
      </div>
    </div>

    <!-- 선택 노드 속성 패널 -->
    <div id="propsPanel" class="props-panel" hidden>
      <div class="props-head">
        <span id="propsTitle"></span>
        <button id="propsClose" class="props-close">✕</button>
      </div>
      <div id="propsBody" class="props-body"></div>
      <div class="props-footer">
        <button id="propsDeleteBtn" class="props-btn props-btn-danger">🗑 삭제</button>
        <button id="propsResetBtn" class="props-btn">↺ 초기화</button>
        <button id="propsApplyBtn" class="props-btn props-btn-primary">✓ 확인</button>
      </div>
    </div>

    <!-- 인풋소스 → 콘솔 연결 시 물리 포트를 고르는 팝업 -->
    <div id="portPicker" class="port-picker" hidden></div>

    <!-- 검증 이슈 패널 -->
    <div id="issuesPanel" class="issues-panel">
      <div class="issues-head" id="issuesToggle">
        <span class="issues-chevron">▾</span>
        <span>이슈</span>
        <span id="issuesCount" class="issues-count">0</span>
      </div>
      <div id="issuesList" class="issues-list"></div>
    </div>

    <!-- 저장/불러오기 -->
    <button id="saveLoadBtn" class="save-load-btn">💾 저장/불러오기</button>
    <div id="saveLoadModal" class="modal-bg" hidden>
      <div class="modal-card">
        <div class="modal-head">
          <span>저장/불러오기</span>
          <button id="saveLoadClose" class="props-close">✕</button>
        </div>
        <div class="modal-body">
          <div class="save-new-row">
            <input id="saveNameInput" type="text" placeholder="현장 이름">
            <button id="saveNewBtn">저장</button>
          </div>
          <div id="saveList" class="save-list"></div>
        </div>
      </div>
    </div>

    <!-- LED디스플레이 노드 추가 팝업: 첫 선택이 "단일 사각형 빠른 설정" vs "자유 설계"
         (여러 구역·비정형 설치면적)인지를 정하는 탭 — 후자는 바로 구역 편집 캔버스로 이동. -->
    <div id="ledAddModal" class="modal-bg" hidden>
      <div class="modal-card">
        <div class="modal-head">
          <span>🟩 LED디스플레이 추가</span>
          <button id="ledAddCloseBtn" class="props-close">✕</button>
        </div>
        <div class="modal-body">
          <div class="led-add-mode-tabs" id="ledAddModeTabs">
            <button type="button" class="led-add-mode-tab on" data-mode="rect">빠른 설정<small>단일 사각형</small></button>
            <button type="button" class="led-add-mode-tab" data-mode="free">자유 설계<small>복합구역·비정형</small></button>
          </div>

          <div id="ledAddRectFields" class="led-add-grid">
            <label class="props-field">가로(m)<input id="ledAddAreaW" type="number" min="0" step="0.5"></label>
            <label class="props-field">세로(m)<input id="ledAddAreaH" type="number" min="0" step="0.5"></label>
            <label class="props-field">LED 피치
              <select id="ledAddPitch">
                <option value="2mm">2mm</option>
                <option value="3mm" selected>3mm</option>
                <option value="4mm">4mm</option>
              </select>
            </label>
            <label class="props-field">패널 크기
              <select id="ledAddPanelSize">
                <option value="500x500">500×500</option>
                <option value="500x1000" selected>500×1000(세로)</option>
                <option value="1000x500">1000×500(가로)</option>
              </select>
            </label>
            <div id="ledAddPreview" class="led-add-preview"></div>
          </div>

          <div id="ledAddFreeNote" class="props-hint" hidden>여러 구역이나 직사각형이 아닌 설치면적은 구역 편집 캔버스에서 직접 그리세요.</div>
        </div>
        <div class="props-footer">
          <button id="ledAddConfirmBtn" class="props-btn props-btn-primary">✓ 추가</button>
        </div>
      </div>
    </div>
  </div>

  <!-- LED 설계 세부 페이지 -->
  <div id="ledDesignView" class="view" hidden>
    <div class="led-header">
      <button id="ledBackBtn" class="led-back-btn">← 그래프로 돌아가기</button>
      <!-- 가로/세로 입력칸은 하나의 묶음으로 취급 — 좁은 화면에서 줄바꿈이
           필요해지면 이 묶음 전체가 통째로 다음 줄로 내려가고, 세로만 따로
           떨어져 나가는 일이 없다. -->
      <div class="led-area-fields">
        <label class="led-area-field">가로(m)<input id="ledAreaW" type="number" min="0" step="0.5"></label>
        <label class="led-area-field">세로(m)<input id="ledAreaH" type="number" min="0" step="0.5"></label>
      </div>
      <span id="ledAreaInch" class="led-area-inch"></span>
    </div>
    <div class="led-body">
      <div class="led-grid-wrap" id="ledGridWrap">
        <div class="led-mode-toolbar">
          <button id="ledCanvasCloseBtn" class="led-canvas-close-btn" hidden>✕ 닫기</button>
          <button class="led-mode-btn on" data-mode="zone">🔧 구역 편집</button>
          <button class="led-mode-btn" data-mode="lan">🔌 LAN 배선</button>
          <button class="led-mode-btn" data-mode="pwr">⚡ PWR 배선</button>
          <span class="led-grid-hint" id="ledModeHint">그리드를 드래그해 새 구역을 만드세요 (500mm 칸 단위)</span>
          <!-- 모바일 전용: 캔버스는 늘 이 화면에 보이지만, 손가락으로 다루기엔
               좁으니 탭하면 실제 기기 회전 없이 화면 전체를 90도 돌려
               캔버스를 크게 쓸 수 있게 한다(initLedDesignView 참고). -->
          <button id="ledOpenCanvasBtn" class="led-canvas-expand-btn" title="캔버스 크게 보기">⛶</button>
        </div>
        <div id="ledNewZoneToolbar" class="led-new-zone-toolbar">
          <div class="led-toolbar-row">
            <span class="led-cfg-label">구역 생성 방식</span>
            <div class="led-chip-group" id="ledZoneCreateModeToggle">
              <button class="led-chip on" data-create-mode="drag">사각형 드래그</button>
              <button class="led-chip" data-create-mode="cell">칸 선택(자유)</button>
            </div>
          </div>
          <div class="led-toolbar-row">
            <span class="led-cfg-label">LED 피치</span>
            <div class="led-chip-group" id="ledNewPitchChips">
              <button class="led-chip" data-pitch="2mm">2mm</button>
              <button class="led-chip on" data-pitch="3mm">3mm</button>
              <button class="led-chip" data-pitch="4mm">4mm</button>
            </div>
          </div>
          <div class="led-toolbar-row" id="ledNewSizeRow">
            <span class="led-cfg-label">패널 크기</span>
            <div class="led-chip-group" id="ledNewSizeChips">
              <button class="led-chip" data-w="500" data-h="500">500×500</button>
              <button class="led-chip on" data-w="500" data-h="1000">500×1000(세로)</button>
              <button class="led-chip" data-w="1000" data-h="500">1000×500(가로)</button>
            </div>
          </div>
          <!-- 칸 선택(자유) 모드 전용: 칸을 클릭/터치/화살표키로 골라 draftCells에 모으고 확정한다.
               자유 구역은 항상 500×500mm 단위로만 채워진다(큰 패널 자동 페어링 없음). -->
          <div id="ledZoneDraftBar" class="led-toolbar-row led-zone-draft-bar" hidden>
            <span id="ledZoneDraftCount">0칸 선택됨</span>
            <div class="led-zone-draft-actions">
              <button id="ledZoneDraftCancelBtn" class="props-btn">취소</button>
              <button id="ledZoneDraftConfirmBtn" class="props-btn props-btn-primary">✓ 구역 확정</button>
            </div>
          </div>
        </div>
        <div class="led-grid-scroll">
          <div class="led-grid-frame" id="ledGridFrame">
            <canvas id="ledGridCanvas" tabindex="0"></canvas>
            <!-- 격자 상하좌우 확장/축소 버튼 — 자동 확장 없이 이 버튼으로만 3칸씩 늘고 준다.
                 캔버스 밖 가장자리에 원형으로 배치. 상하단은 화살표만(밖을 향하면 확장,
                 안을 향하면 축소), 좌우는 확장(+)/축소(−) 기호 한 쌍. -->
            <div class="led-grid-btns led-grid-btns-top">
              <button class="led-grid-btn led-grid-btn-arrow-only" data-dir="up" data-action="expand" title="위로 3칸 확장"><span class="grid-arrow grid-arrow-up"></span></button>
              <button class="led-grid-btn led-grid-btn-arrow-only" data-dir="up" data-action="shrink" title="위에서 3칸 줄이기"><span class="grid-arrow grid-arrow-down"></span></button>
            </div>
            <div class="led-grid-btns led-grid-btns-bottom">
              <button class="led-grid-btn led-grid-btn-arrow-only" data-dir="down" data-action="expand" title="아래로 3칸 확장"><span class="grid-arrow grid-arrow-down"></span></button>
              <button class="led-grid-btn led-grid-btn-arrow-only" data-dir="down" data-action="shrink" title="아래에서 3칸 줄이기"><span class="grid-arrow grid-arrow-up"></span></button>
            </div>
            <div class="led-grid-btns led-grid-btns-left">
              <button class="led-grid-btn" data-dir="left" data-action="expand" title="왼쪽으로 3칸 확장">+<span class="grid-arrow grid-arrow-left"></span></button>
              <button class="led-grid-btn" data-dir="left" data-action="shrink" title="왼쪽에서 3칸 줄이기">−<span class="grid-arrow grid-arrow-left"></span></button>
            </div>
            <div class="led-grid-btns led-grid-btns-right">
              <button class="led-grid-btn" data-dir="right" data-action="expand" title="오른쪽으로 3칸 확장">+<span class="grid-arrow grid-arrow-right"></span></button>
              <button class="led-grid-btn" data-dir="right" data-action="shrink" title="오른쪽에서 3칸 줄이기">−<span class="grid-arrow grid-arrow-right"></span></button>
            </div>
          </div>
        </div>
      </div>
      <div class="led-side">
        <div id="ledZoneSection" class="led-side-section">
          <div class="led-side-title-row">
            <span class="led-side-title">구역 <span id="ledZoneCount">0</span></span>
            <div class="led-side-title-actions">
              <button id="ledZoneCompactBtn" class="zone-btn">캔버스 여백 정리</button>
              <button id="ledZoneResetAllBtn" class="zone-btn zone-del-btn">초기화</button>
            </div>
          </div>
          <!-- "캔버스 여백 정리" 후에만 보이는 전체(모든 구역 합산) 해상도 -->
          <div id="ledOverallRes" class="led-overall-res" hidden></div>
          <div id="ledZoneList" class="led-zone-list"></div>
        </div>
        <div id="ledPortSection" class="led-side-section" hidden>
          <div class="led-port-source-row">
            <div class="led-port-source" id="ledPortSource"></div>
            <!-- PWR 배선에서만 보이는 포트 수 조절(LAN은 상류 장비 스펙으로 고정) -->
            <div id="ledPwrPortControls" class="led-pwr-port-controls" hidden>
              <button id="ledPwrPortRemoveBtn" class="pwr-port-count-btn" title="포트 제거">−</button>
              <button id="ledPwrPortAddBtn" class="pwr-port-count-btn" title="포트 추가">+</button>
            </div>
            <span id="ledDragBadge" class="drag-badge" hidden>✋ 드래그 중</span>
          </div>
          <div id="ledPortStrip" class="led-port-strip"></div>
          <div id="ledPortDetail" class="led-port-detail"></div>
          <div class="led-port-actions">
            <button id="ledAutoAssignBtn" class="led-auto-btn">자동 할당</button>
            <button id="ledResetAllBtn" class="props-btn props-btn-danger">전체 초기화</button>
          </div>
          <div id="ledCableSum" class="led-cable-sum"></div>
        </div>
        <div class="led-side-section led-total">
          총 필요 픽셀: <b id="ledTotalPx">0</b>px
        </div>
      </div>
    </div>
  </div>

</div>

<!-- 업데이트 배너 (포그라운드 중 새 버전 준비 시 표시) -->
<div id="updateBanner" class="update-banner">
  <div class="update-banner-card">
    <div class="upd-title">업데이트 준비 완료</div>
    <div class="upd-body">새 버전이 준비됐습니다.<br>지금 업데이트하시겠습니까?</div>
    <button onclick="_swReload()">지금 업데이트</button>
  </div>
</div>
<!-- 업데이트 완료 토스트 (자동/수동 업데이트 후 다음 로드에서 표시) -->
<div id="updateToast" class="update-toast">
  <div id="updateToastCard" class="update-toast-card"></div>
</div>
<!-- 앱 공통 토스트 -->
<div id="appToast" class="app-toast"></div>

<script src="./js/core/idgen.js"></script>
<script src="./js/core/nodeTypes.js"></script>
<script src="./js/core/graphOps.js"></script>
<script src="./js/devices/devices.js"></script>
<script src="./js/core/state.js"></script>
<script src="./js/core/canvasRenderer.js"></script>
<script src="./js/core/nodeCardRenderer.js"></script>
<script src="./js/core/propertiesPanel.js"></script>
<script src="./js/validation/capacityRules.js"></script>
<script src="./js/validation/validationEngine.js"></script>
<script src="./js/leddesign/specs.js"></script>
<script src="./js/leddesign/betaPanels.js"></script>
<script src="./js/leddesign/betaAreaInchLabel.js"></script>
<script src="./js/leddesign/portAssignment.js"></script>
<script src="./js/leddesign/ledAreaSetup.js"></script>
<script src="./js/leddesign/ledPortGroups.js"></script>
<script src="./js/leddesign/ledDesignView.js"></script>
<script src="./js/save/projectState.js"></script>
<script src="./js/save/saveStore.js"></script>
<script src="./js/core/interactions.js"></script>
<script src="./js/app.js"></script>

<!-- Service Worker 등록 -->
<script>
  if ('serviceWorker' in navigator) {
    const _wasControlled = !!navigator.serviceWorker.controller;
    let _updateReady = false;

    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!_wasControlled) { return; } // 최초 설치 — 업데이트 아님
      if (document.hidden) {
        _updateReady = true;
      } else {
        document.getElementById('updateBanner').style.display = 'flex';
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && _updateReady) {
        _updateReady = false;
        sessionStorage.setItem('sw-just-updated', '1');
        location.reload();
      }
    });

    window._swReload = async function () {
      try { sessionStorage.setItem('sw-just-updated', '1'); } catch (_) {}
      if (navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage('RECACHE_CORE');
        await new Promise(r => setTimeout(r, 1500));
      }
      location.reload();
    };

    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' })
        .catch(err => console.warn('SW 등록 실패:', err));
    });
  }
</script>
</body>
</html>
